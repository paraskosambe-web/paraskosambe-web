name: Generate Snake

# Builds the contribution snake used in the README:
#   https://raw.githubusercontent.com/paraskosambe-web/paraskosambe-web/output/github-snake.svg
#   https://raw.githubusercontent.com/paraskosambe-web/paraskosambe-web/output/github-snake-dark.svg
# The files are committed to the dedicated `output` branch, so `main` stays clean.

on:
  # refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow running it manually from the Actions tab
  workflow_dispatch:
  # regenerate whenever the profile repo is pushed to
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#22d3ee&color_dots=#0f172a,#164e63,#0e7490,#22d3ee,#67e8f9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: Push them to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake 🐍"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
