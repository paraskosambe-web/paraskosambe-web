<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" width="1200" height="84" role="img"
     aria-label="Visit my live portfolio: paras-kosambe.vercel.app">
  <title>Visit my live portfolio: paras-kosambe.vercel.app</title>
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#061020"/>
      <stop offset="55%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#170f30"/>
    </linearGradient>
    <linearGradient id="sEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sClip"><rect x="0" y="0" width="1200" height="84" rx="16"/></clipPath>
    <style>
      .sweep { animation: sw 4.6s linear infinite; }
      @keyframes sw { 0% { transform: translateX(-1200px); } 60%,100% { transform: translateX(1200px); } }
    </style>
  </defs>
  <g clip-path="url(#sClip)">
    <rect width="1200" height="84" fill="url(#sBg)"/>
    <rect class="sweep" x="-1200" y="0" width="1200" height="84" fill="url(#sShine)"/>

    <circle cx="46" cy="42" r="21" fill="#0b1a2b" stroke="#22d3ee" stroke-opacity="0.6"/>
    <circle cx="46" cy="42" r="21" fill="none" stroke="#22d3ee" stroke-opacity="0.3">
      <animate attributeName="r" values="21;29;21" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-opacity="0.9">
      <circle cx="46" cy="42" r="11"/><ellipse cx="46" cy="42" rx="11" ry="4.3"/><ellipse cx="46" cy="42" rx="4.3" ry="11"/>
    </g>
    <circle cx="55" cy="33" r="3" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>

    <text x="86" y="38" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="0.6" fill="#c9f2ff">Live Portfolio</text>
    <text x="86" y="62" font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="0.6" fill="#7f9bb8">paras-kosambe.vercel.app</text>

    <g>
      <rect x="950" y="22" width="204" height="40" rx="20" fill="#0e7490" fill-opacity="0.32" stroke="#22d3ee" stroke-opacity="0.7"/>
      <rect x="950" y="22" width="204" height="40" rx="20" fill="none" stroke="#67e8f9" stroke-opacity="0.4">
        <animate attributeName="stroke-opacity" values="0.15;0.8;0.15" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="1052" y="47" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.8" fill="#eaf8ff">VISIT SITE</text>
      <g transform="translate(1134,36)">
        <g stroke="#67e8f9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
