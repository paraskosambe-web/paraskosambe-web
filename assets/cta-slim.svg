        </g>
        <animateTransform attributeName="transform" type="translate" values="1134 36;1140 36;1134 36" dur="1.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <rect x="0.9" y="0.9" width="1198.2" height="82.2" rx="16" fill="none" stroke="url(#sEdge)" stroke-width="1.4"/>
