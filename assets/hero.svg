<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Paras Kosambe, Aspiring Data Scientist" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .sans{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes draw{0%{stroke-dashoffset:1}35%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
  @keyframes pt{0%,2%{opacity:0;transform:scale(0)}8%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateX(360px);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .r1{animation:rise .9s ease-out both}
  .r2{animation:rise .9s .15s ease-out both}
  .r3{animation:rise .9s .3s ease-out both}
  .r4{animation:rise .9s .5s ease-out both}
  .r5{animation:rise .9s .7s ease-out both}
  .line{stroke-dasharray:1;animation:draw 7s ease-in-out infinite}
  .p{transform-box:fill-box;transform-origin:center;opacity:0;animation:pt 7s ease-out infinite}
  .cur{animation:blink 1s steps(1) infinite}
  .scan{animation:scan 7s linear infinite}
  .lbl{animation:pulse 3s ease-in-out infinite}
</style>
