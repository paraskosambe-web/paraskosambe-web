<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 62" width="415" height="62" role="img" aria-label="Art Gallery">
  <title>Art Gallery</title>
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061020"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="415" height="62" rx="14"/></clipPath>
    <style>
      .shine { animation: sweep 4.2s linear infinite; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .arrow { animation: nudge 1.8s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-415px); } 55%,100% { transform: translateX(415px); } }
      @keyframes pulse { 0%,100% { opacity: .35; r: 16; } 50% { opacity: .9; r: 19; } }
      @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="415" height="62" fill="url(#btnBg)"/>
    <rect width="415" height="62" fill="url(#edge)" fill-opacity="0.10"/>
    <rect class="shine" x="-415" y="0" width="415" height="62" fill="url(#shine)"/>

    <!-- icon -->
    <g transform="translate(22,14)">
      <rect x="-8" y="-8" width="34" height="34" rx="10" fill="#f472b6" fill-opacity="0.10" stroke="#f472b6" stroke-opacity="0.35"/>
      <g transform="translate(0.5,0.5)"><g stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none"><path d="M9 1a8 8 0 1 0 0 16c2 0 2.4-1.4 1.4-2.4-1-1 0-2.6 1.6-2.6H15a3.5 3.5 0 0 0 3.5-3.5C18.5 4.6 14.4 1 9 1z"/><circle cx="6" cy="6.5" r="1.3" fill="#f472b6"/><circle cx="11" cy="5" r="1.3" fill="#f472b6"/><circle cx="6" cy="11.5" r="1.3" fill="#f472b6"/></g></g>
    </g>

    <!-- label -->
    <text x="64" y="28" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" letter-spacing="0.9" fill="#eaf4ff">Art Gallery</text>
    <text x="64" y="46" font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.7" fill="#7f93ab">graphite · charcoal · digital</text>

    <!-- arrow (outer group holds the position, inner group is the animated one) -->
    <g transform="translate(381,24)">
      <g class="arrow" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
        <path d="M0 7h13"/><path d="M8 2l5 5-5 5"/>
      </g>
    </g>

    <rect x="0.9" y="0.9" width="413.2" height="60.2" rx="14" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
</svg>
