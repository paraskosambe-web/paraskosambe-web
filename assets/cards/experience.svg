<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img">
<style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shim{0%{transform:translateX(-260px)}100%{transform:translateX(1160px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.a{animation:rise .8s ease-out both}
.sh{animation:shim 5s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.dr{stroke-dasharray:1;animation:draw 6s ease-in-out infinite}
.bl{animation:blink 1s steps(1) infinite}
.nd{animation:nudge 1.6s ease-in-out infinite}
.m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .s{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141414"/></pattern>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>

</defs>
<rect width="900" height="440" fill="#0A0A0A"/><rect width="900" height="440" fill="url(#g)"/>
<rect x=".5" y=".5" width="899" height="439" fill="none" stroke="#1F1F1F"/>
<rect class="sh" x="0" y="0" width="260" height="1.5" fill="url(#sg)"/>
<path class="dr" pathLength="1" d="M70 40V384" stroke="#5A5A5A" stroke-width="1.5" fill="none"/><circle class="rg" style="animation-delay:0.0s" cx="70" cy="40" r="5" fill="none" stroke="#F5F5F5"/><circle cx="70" cy="40" r="5" fill="#F5F5F5"/><g class="a" style="animation-delay:0.30s"><text class="m" x="110" y="34" font-size="12" letter-spacing="1.5" fill="#6B6B6B">NOV 2026 – FEB 2027</text><text class="s" x="110" y="58" font-size="21" font-weight="800" fill="#F5F5F5">UptoSkills</text><text class="s" x="110" y="78" font-size="14" fill="#A3A3A3">AI &amp; ML Intern  ·  Part-time remote internship</text></g><circle class="rg" style="animation-delay:0.4s" cx="70" cy="126" r="5" fill="none" stroke="#F5F5F5"/><circle cx="70" cy="126" r="5" fill="#F5F5F5"/><g class="a" style="animation-delay:0.60s"><text class="m" x="110" y="120" font-size="12" letter-spacing="1.5" fill="#6B6B6B">NOV 2026</text><text class="s" x="110" y="144" font-size="21" font-weight="800" fill="#F5F5F5">CodeAlpha</text><text class="s" x="110" y="164" font-size="14" fill="#A3A3A3">Data Science Intern  ·  Virtual, task-based internship</text></g><circle class="rg" style="animation-delay:0.8s" cx="70" cy="212" r="5" fill="none" stroke="#F5F5F5"/><circle cx="70" cy="212" r="5" fill="#F5F5F5"/><g class="a" style="animation-delay:0.90s"><text class="m" x="110" y="206" font-size="12" letter-spacing="1.5" fill="#6B6B6B">NOV – DEC 2026</text><text class="s" x="110" y="230" font-size="21" font-weight="800" fill="#F5F5F5">IBM SkillsBuild  ·  Edunet Foundation, AICTE</text><text class="s" x="110" y="250" font-size="14" fill="#A3A3A3">Intern, AI and IBM Bob  ·  Mentor sessions, IBM SkillsBuild courses, final project presentation</text></g><circle class="rg" style="animation-delay:1.2s" cx="70" cy="298" r="5" fill="none" stroke="#F5F5F5"/><circle cx="70" cy="298" r="5" fill="#F5F5F5"/><g class="a" style="animation-delay:1.20s"><text class="m" x="110" y="292" font-size="12" letter-spacing="1.5" fill="#6B6B6B">NOV – DEC 2026</text><text class="s" x="110" y="316" font-size="21" font-weight="800" fill="#F5F5F5">NEXLEVR</text><text class="s" x="110" y="336" font-size="14" fill="#A3A3A3">Prompt Engineering Intern  ·  Task-based remote internship</text></g><circle class="rg" style="animation-delay:1.6s" cx="70" cy="384" r="5" fill="none" stroke="#F5F5F5"/><circle cx="70" cy="384" r="5" fill="#F5F5F5"/><g class="a" style="animation-delay:1.50s"><text class="m" x="110" y="378" font-size="12" letter-spacing="1.5" fill="#6B6B6B">2026</text><text class="s" x="110" y="402" font-size="21" font-weight="800" fill="#F5F5F5">Google Student Ambassador Program</text><text class="s" x="110" y="422" font-size="14" fill="#A3A3A3">Student Ambassador  ·  Student programme</text></g>
</svg>