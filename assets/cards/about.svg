<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img">
<style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shim{0%{transform:translateX(-260px)}100%{transform:translateX(1160px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.a{animation:rise .8s ease-out both}
.sh{animation:shim 5s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.dr{stroke-dasharray:1;animation:draw 6s ease-in-out infinite}
.bl{animation:blink 1s steps(1) infinite}
.nd{animation:nudge 1.6s ease-in-out infinite}
.m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .s{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141414"/></pattern>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>

</defs>
<rect width="900" height="310" fill="#0A0A0A"/><rect width="900" height="310" fill="url(#g)"/>
<rect x=".5" y=".5" width="899" height="309" fill="none" stroke="#1F1F1F"/>
<rect class="sh" x="0" y="0" width="260" height="1.5" fill="url(#sg)"/>
<text class="s a" style="animation-delay:0.00s" x="32" y="48" font-size="17" font-weight="600" fill="#F5F5F5" >Final-year B.Sc. Computer Science student at</text><text class="s a" style="animation-delay:0.15s" x="32" y="78" font-size="17" font-weight="600" fill="#F5F5F5" >D.G. Ruparel College, University of Mumbai,</text><text class="s a" style="animation-delay:0.30s" x="32" y="108" font-size="17" font-weight="600" fill="#F5F5F5" >building towards a career in Data Science.</text><text class="s a" style="animation-delay:0.60s" x="32" y="154" font-size="17" font-weight="400" fill="#A3A3A3" >I like working with data, building practical applications,</text><text class="s a" style="animation-delay:0.75s" x="32" y="184" font-size="17" font-weight="400" fill="#A3A3A3" >exploring AI and solving real-world problems.</text><text class="s a" style="animation-delay:0.90s" x="32" y="214" font-size="17" font-weight="400" fill="#A3A3A3" >I'd rather apply what I learn in a project than</text><text class="s a" style="animation-delay:1.05s" x="32" y="244" font-size="17" font-weight="400" fill="#A3A3A3" >collect technologies I never use.</text><g class="a" style="animation-delay:0.30s"><rect x="620" y="28" width="256" height="56" fill="#0F0F0F" stroke="#262626"/><text class="m" x="636" y="50" font-size="10" letter-spacing="2" fill="#6B6B6B">STATUS</text><text class="s" x="636" y="71" font-size="17" font-weight="700" fill="#F5F5F5">Final-year B.Sc. CS</text><circle class="pl" cx="860" cy="42" r="3" fill="#F5F5F5"/></g><g class="a" style="animation-delay:0.50s"><rect x="620" y="96" width="256" height="56" fill="#0F0F0F" stroke="#262626"/><text class="m" x="636" y="118" font-size="10" letter-spacing="2" fill="#6B6B6B">UNIVERSITY</text><text class="s" x="636" y="139" font-size="17" font-weight="700" fill="#F5F5F5">Univ. of Mumbai</text><circle class="pl" cx="860" cy="110" r="3" fill="#F5F5F5"/></g><g class="a" style="animation-delay:0.70s"><rect x="620" y="164" width="256" height="56" fill="#0F0F0F" stroke="#262626"/><text class="m" x="636" y="186" font-size="10" letter-spacing="2" fill="#6B6B6B">FOCUS</text><text class="s" x="636" y="207" font-size="17" font-weight="700" fill="#F5F5F5">Data Science</text><circle class="pl" cx="860" cy="178" r="3" fill="#F5F5F5"/></g><g class="a" style="animation-delay:0.90s"><rect x="620" y="232" width="256" height="56" fill="#0F0F0F" stroke="#262626"/><text class="m" x="636" y="254" font-size="10" letter-spacing="2" fill="#6B6B6B">ALSO</text><text class="s" x="636" y="275" font-size="17" font-weight="700" fill="#F5F5F5">AI · ML · Full-stack</text><circle class="pl" cx="860" cy="246" r="3" fill="#F5F5F5"/></g>
</svg>