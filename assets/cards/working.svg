<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img">
<style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shim{0%{transform:translateX(-260px)}100%{transform:translateX(1160px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:1}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.a{animation:rise .8s ease-out both}
.sh{animation:shim 5s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
.dr{stroke-dasharray:1;animation:draw 6s ease-in-out infinite}
.bl{animation:blink 1s steps(1) infinite}
.nd{animation:nudge 1.6s ease-in-out infinite}
.m{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace} .s{font-family:Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#141414"/></pattern>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".08" stop-color="#fff"/><stop offset=".92" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>

</defs>
<rect width="900" height="320" fill="#0A0A0A"/><rect width="900" height="320" fill="url(#g)"/>
<rect x=".5" y=".5" width="899" height="319" fill="none" stroke="#1F1F1F"/>
<rect class="sh" x="0" y="0" width="260" height="1.5" fill="url(#sg)"/>
<g class="a" style="animation-delay:0.20s"><text class="m" x="32" y="54" font-size="13" fill="#6B6B6B">01</text><text class="s" x="76" y="55" font-size="18" font-weight="600" fill="#F5F5F5">Strengthening Python and problem-solving fundamentals</text><path d="M32 70H868" stroke="#1F1F1F"/><path class="dr" pathLength="1" style="animation-delay:0.20s" d="M32 70H868" stroke="#8C8C8C" stroke-width="1" fill="none"/><text class="m nd" x="852" y="55" font-size="16" fill="#8C8C8C">→</text></g><g class="a" style="animation-delay:0.45s"><text class="m" x="32" y="112" font-size="13" fill="#6B6B6B">02</text><text class="s" x="76" y="113" font-size="18" font-weight="600" fill="#F5F5F5">Learning and applying SQL, statistics, data analysis and ML</text><path d="M32 128H868" stroke="#1F1F1F"/><path class="dr" pathLength="1" style="animation-delay:0.45s" d="M32 128H868" stroke="#8C8C8C" stroke-width="1" fill="none"/><text class="m nd" x="852" y="113" font-size="16" fill="#8C8C8C">→</text></g><g class="a" style="animation-delay:0.70s"><text class="m" x="32" y="170" font-size="13" fill="#6B6B6B">03</text><text class="s" x="76" y="171" font-size="18" font-weight="600" fill="#F5F5F5">Exploring AI, Generative AI and Agentic AI</text><path d="M32 186H868" stroke="#1F1F1F"/><path class="dr" pathLength="1" style="animation-delay:0.70s" d="M32 186H868" stroke="#8C8C8C" stroke-width="1" fill="none"/><text class="m nd" x="852" y="171" font-size="16" fill="#8C8C8C">→</text></g><g class="a" style="animation-delay:0.95s"><text class="m" x="32" y="228" font-size="13" fill="#6B6B6B">04</text><text class="s" x="76" y="229" font-size="18" font-weight="600" fill="#F5F5F5">Building projects that combine data, AI and software engineering</text><path d="M32 244H868" stroke="#1F1F1F"/><path class="dr" pathLength="1" style="animation-delay:0.95s" d="M32 244H868" stroke="#8C8C8C" stroke-width="1" fill="none"/><text class="m nd" x="852" y="229" font-size="16" fill="#8C8C8C">→</text></g><g class="a" style="animation-delay:1.20s"><text class="m" x="32" y="286" font-size="13" fill="#6B6B6B">05</text><text class="s" x="76" y="287" font-size="18" font-weight="600" fill="#F5F5F5">Completing internships in AI/ML, data science and prompt engineering</text><path d="M32 302H868" stroke="#1F1F1F"/><path class="dr" pathLength="1" style="animation-delay:1.20s" d="M32 302H868" stroke="#8C8C8C" stroke-width="1" fill="none"/><text class="m nd" x="852" y="287" font-size="16" fill="#8C8C8C">→</text></g>
</svg>