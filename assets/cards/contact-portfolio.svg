<style>@keyframes shim{0%{transform:translateX(-120px)}100%{transform:translateX(410px)}}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
