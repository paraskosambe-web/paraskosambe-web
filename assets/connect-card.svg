      <text x="114" y="244" font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e9f3ff" textLength="330" lengthAdjust="spacingAndGlyphs">@paras.arts.3313</text>
      <g transform="translate(548,214)">
        <g stroke="#e1306c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M0 8h20"/><path d="M13 1l7 7-7 7"/>
        </g>
      </g>
    </g>
    <g>
      <rect x="600" y="168" width="560" height="108" rx="16" fill="#0b1526" stroke="#a78bfa" stroke-opacity="0.45"/>
      <rect x="600" y="168" width="560" height="108" rx="16" fill="#a78bfa" fill-opacity="0.07"/>
      <rect x="600" y="168" width="4" height="108" rx="2" fill="#a78bfa" opacity="0.9"/>
      <circle cx="640" cy="222" r="16" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.6"/>
      <circle cx="640" cy="222" r="6" fill="#a78bfa">
