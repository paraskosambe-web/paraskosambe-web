<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="Let's connect: email, LinkedIn, Instagram, portfolio">
  <title>Let's connect: email, LinkedIn, Instagram, portfolio</title>
  <defs>
    <linearGradient id="ccBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d19"/>
      <stop offset="55%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#120e2a"/>
    </linearGradient>
    <linearGradient id="ccEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="ccGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="ccClip"><rect x="0" y="0" width="1200" height="300" rx="20"/></clipPath>
    <style>
      .fade { animation: fade 3.4s ease-in-out infinite; }
      @keyframes fade { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#ccClip)">
