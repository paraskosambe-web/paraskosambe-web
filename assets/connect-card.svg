      <text x="674" y="244" font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#e9f3ff" textLength="330" lengthAdjust="spacingAndGlyphs">paras-kosambe.vercel.app</text>
      <g transform="translate(1108,214)">
