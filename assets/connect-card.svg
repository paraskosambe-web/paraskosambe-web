    <rect width="1200" height="300" fill="url(#ccGrid)"/>

    <text x="40" y="30" font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2.6" fill="#5b7288">// LET&#39;S CONNECT</text>
    <text x="1160" y="30" text-anchor="end" font-family="'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#22d3ee" class="fade">open to internships &amp; collaborations</text>

    <g>
