      <rect x="40" y="168" width="4" height="108" rx="2" fill="#e1306c" opacity="0.9"/>
      <circle cx="80" cy="222" r="16" fill="#e1306c" fill-opacity="0.16" stroke="#e1306c" stroke-opacity="0.6"/>
      <circle cx="80" cy="222" r="6" fill="#e1306c">
